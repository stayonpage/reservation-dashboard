name: 예약 메일 폴링

on:
  schedule:
    # 저장소 히스토리 재작성/공개 전환 이후 GitHub의 스케줄 등록이 갱신되지 않는 문제가
    # 있어 파일을 다시 커밋해 재등록시킴.
    # Vercel Active CPU 절약: 낮(KST 06:00~21:30)에는 30분마다, 밤(KST 22:00~06:00)에는
    # 06:00 한 번만 폴링. GitHub cron 은 UTC 기준 (KST = UTC+9).
    - cron: '0,30 21-23 * * *' # KST 06:00~08:30
    - cron: '0,30 0-12 * * *' # KST 09:00~21:30
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: 네이버 메일 폴링
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://reservation-dashboard-pi.vercel.app/api/cron/poll-naver"
      - name: 지메일(스테이폴리오·아임웹) 메일 폴링
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://reservation-dashboard-pi.vercel.app/api/cron/poll-gmail"
      - name: 스테이폴리오 예약 재확인(취소 감지)
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://reservation-dashboard-pi.vercel.app/api/cron/reconcile-stayfolio"
